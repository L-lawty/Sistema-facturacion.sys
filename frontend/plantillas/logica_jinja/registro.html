<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta · facturación</title>
    <link rel="stylesheet" href="/static/styles/acceso.css">
</head>
<body>
    <section class="acceso__marca">
        <p class="acceso__marca__logo">facturación <span>.sys</span></p>
        <div class="acceso__marca__cuerpo">
            <h1 class="acceso__marca__titulo">Crea tu cuenta<br>en segundos.</h1>
            <p class="acceso__marca__descripcion">Un solo usuario por negocio. Podrás invitar más adelante a tu equipo.</p>
        </div>
        <p class="acceso__marca__pie">sistema de gestión empresarial</p>
    </section>

    <section class="acceso__formulario">
        <div class="tarjeta-acceso">
            <header class="tarjeta-acceso__encabezado">
                <h2 class="tarjeta-acceso__titulo">Crear cuenta</h2>
                <p class="tarjeta-acceso__subtitulo">¿Ya tienes cuenta? <a href="/login">Iniciar sesión</a></p>
            </header>

            <form class="formulario-acceso"
                  hx-post="/registro"
                  hx-target="#contenedor-error-registro"
                  hx-swap="innerHTML"
                  hx-indicator="#indicador-registro">

                <div id="contenedor-error-registro">
                    {% if error %}
                    <p class="formulario-acceso__error">{{ error }}</p>
                    {% endif %}
                </div>

                <div class="campo">
                    <label class="campo__etiqueta" for="nombre">Nombre de usuario</label>
                    <input class="campo__control" type="text" id="nombre" name="nombre" placeholder="tu nombre" autocomplete="username" required minlength="3">
                </div>

                <div class="campo">
                    <label class="campo__etiqueta" for="contrasena">Contraseña</label>
                    <input class="campo__control" type="password" id="contrasena" name="contrasena" placeholder="mínimo 8 caracteres" autocomplete="new-password" required minlength="8">
                </div>

                <div class="campo">
                    <label class="campo__etiqueta" for="confirmar_contrasena">Confirmar contraseña</label>
                    <input class="campo__control" type="password" id="confirmar_contrasena" name="confirmar_contrasena" placeholder="repite la contraseña" autocomplete="new-password" required minlength="8">
                </div>

                <button class="boton boton--principal" type="submit">
                    <span class="htmx-indicator" id="indicador-registro">Creando... </span>Crear cuenta
                </button>
            </form>

            <p class="tarjeta-acceso__pie">Tus datos se protegen con hash bcrypt</p>
        </div>
    </section>
</body>
</html>
